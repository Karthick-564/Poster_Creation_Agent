    name: "Kumaraguru College of Technology"
    palette:
      primary: "#1E2842"
      secondary: "#85CEBD"
      tertiary: "#705355"
      neutral: "#C8C7CC"
      surface: "#FFFFFF"
    fonts:
      display: "Montserrat"
      body: "Inter"
      mono: "JetBrains Mono"
      tamil: "Noto Sans Tamil"
    logo: "assets/logo_kumaraguru.png"
    logo_rules: "Never place logo on gradients; place on solid brand field or clean white background"

