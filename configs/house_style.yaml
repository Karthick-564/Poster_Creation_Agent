formats:
  story: [1080, 1920]       # 9:16 portrait (DEFAULT - 81% of corpus)
  square: [1080, 1080]      # 1:1 square
  fourfive: [1080, 1350]    # 4:5 portrait
  A3: [842, 1191]           # A3 portrait print points
  A4: [595, 842]            # A4 portrait print points

genres:
  hiring:
    keywords: ["hiring", "recruitment", "recruiting", "drive", "open positions", "leads", "team members", "job", "careers"]
    policy: "institutional"
  recruitment:
    keywords: ["recruitment", "recruiting", "open positions", "leads", "team members", "join our team"]
    policy: "institutional"
  admission:
    keywords: ["admission", "programme", "course", "diploma", "b.sc", "m.sc", "degree", "curriculum"]
    policy: "institutional"
  workshop:
    keywords: ["workshop", "talk", "session", "lecture", "seminar", "webinar", "expert talk", "training"]
    policy: "institutional"
  event:
    keywords: ["event", "orientation", "freshers", "inauguration", "launch", "annual"]
    policy: "institutional"
  festival:
    keywords: ["festival", "wishes", "celebration", "day", "engineers day", "reunion"]
    policy: "institutional"
  commemoration:
    keywords: ["commemoration", "foundation day", "memorial"]
    policy: "institutional"
  achievement:
    keywords: ["achievement", "congratulations", "naac", "awards", "excellence", "ranked"]
    policy: "institutional"
  conference:
    keywords: ["conference", "summit", "conclave", "symposium"]
    policy: "institutional"
  cultural:
    keywords: ["cultural", "concert", "drama", "music", "dance", "fest", "gaana", "orchestra"]
    policy: "cultural"
  alumni:
    keywords: ["alumni", "batch", "reunion", "decade"]
    policy: "institutional"
  campaign:
    keywords: ["campaign", "awareness", "save life", "soil day", "drive"]
    policy: "institutional"

structural_policies:
  institutional:
    allow_cards: true
    allow_pills: true
    allow_banner_tab: true
    allow_footer_bar: true
    allow_qr: true
  cultural:
    allow_cards: false
    allow_pills: false
    allow_banner_tab: false
    allow_footer_bar: true
    allow_qr: true
